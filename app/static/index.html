<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>音声文字起こし</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>音声文字起こし</h1>
    <p class="lead">iPhoneのボイスメモなどの録音を文字にします。英語の音声は日本語に翻訳できます。</p>
  </header>

  <form id="form" class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="audio/*,video/*,.m4a,.caf,.aac,.mp3,.wav,.mp4,.mov">
      <span class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </span>
      <span id="file-label">録音ファイルを選択</span>
      <small id="file-meta">m4a / mp3 / wav / caf / mp4 など</small>
    </label>

    <div class="options">
      <label>
        <span>音声の言語</span>
        <select id="language">
          <option value="auto">自動判定</option>
          <option value="ja">日本語</option>
          <option value="en">英語</option>
        </select>
      </label>
      <label>
        <span>モード</span>
        <select id="quality">
          <option value="fast">速度優先</option>
          <option value="accurate">精度優先</option>
        </select>
      </label>
    </div>
    <label class="toggle">
      <input type="checkbox" id="translate" checked>
      <span>英語の音声を日本語に翻訳する</span>
    </label>

    <button type="submit" id="start" disabled>文字起こしを開始</button>
  </form>

  <section id="progress" class="card" hidden>
    <div class="progress-row">
      <span id="status">準備中…</span>
      <span id="percent"></span>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <p id="meta" class="meta"></p>
    <button type="button" id="cancel" class="secondary">中止</button>
  </section>

  <section id="result" hidden>
    <div class="toolbar">
      <button type="button" data-action="copy-original" class="secondary">原文をコピー</button>
      <button type="button" data-action="copy-translation" class="secondary translation-only">訳文をコピー</button>
      <button type="button" data-action="download-txt" class="secondary">テキスト保存</button>
      <button type="button" data-action="download-srt" class="secondary">字幕(SRT)保存</button>
    </div>
    <div id="output"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
